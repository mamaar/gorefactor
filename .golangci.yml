version: "2"

run:
  timeout: 3m
  go: "1.27"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - usetesting
    - nolintlint
    - predeclared
    - thelper
    - errorlint
    - makezero
    - wastedassign
    - unconvert
    - modernize
    - mirror
    - intrange
    - copyloopvar
